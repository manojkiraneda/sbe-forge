name: PPE42 firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  applications:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install firmware build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zstd

      - name: Download locked PPE42 toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-toolchain.sh

      - name: Build and validate applications
        run: ./scripts/test-firmware.sh

      - name: Upload firmware binaries and disassemblies
        uses: actions/upload-artifact@v4
        with:
          name: ppe42-firmware-${{ github.sha }}
          path: |
            build/firmware/*.bin
            build/firmware/*.dis
          if-no-files-found: error
          compression-level: 9
          retention-days: 5

  source-reproducibility:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build compiler and applications from source
        run: ./scripts/dev.sh
