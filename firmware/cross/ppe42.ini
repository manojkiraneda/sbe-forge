[binaries]
c = ['/opt/llvm-install/bin/clang', '-target', 'powerpc-unknown-elf', '-mcpu=ppe42', '-msoft-float']
ar = '/opt/llvm-install/bin/llvm-ar'
strip = '/opt/llvm-install/bin/llvm-strip'
objcopy = '/opt/llvm-install/bin/llvm-objcopy'

[host_machine]
system = 'none'
cpu_family = 'ppc'
cpu = 'ppe42'
endian = 'big'

[properties]
needs_exe_wrapper = true
llvm_install_dir = '/opt/llvm-install'
